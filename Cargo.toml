[package]
name = "pironman5_rust"
version = "1.2.22"
edition = "2021"
authors = ["SunFounder <service@sunfounder.com>"]
description = "Rust implementation of Pironman5 - Library for monitoring Raspberry Pi system status"
license = "GPL-2.0"

[[bin]]
name = "pironman5"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
signal-hook = "0.3"
ctrlc = "3.4"
chrono = "0.4"

# Hardware control dependencies (Linux/ARM only)
[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.18"                    # Raspberry Pi GPIO, PWM, SPI, I2C
embedded-hal = "0.2"              # Hardware abstraction layer (compatible with rppal 0.18)
palette = "0.7"                   # Color manipulation
ssd1306 = "0.7"                   # OLED display driver (SSD1306) - compatible with embedded-hal 0.2
embedded-graphics = "0.7"         # Graphics primitives for OLED - compatible with ssd1306 0.7
smart-leds = "0.4"                # LED trait definitions
ws2812-spi = "0.4"                # WS2812 LED control via SPI - compatible with embedded-hal 0.2
